<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nugi City Raster by TerraGrid</title>
  <script src="https://unpkg.com/cesium@1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium@1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    #mapZoomControls {
      position: absolute; right: 16px; bottom: 32px; z-index: 999;
      display: flex; flex-direction: column; border-radius: 6px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      font-family: sans-serif;
    }
    #mapZoomControls button {
      width: 40px; height: 40px; border: none; background: rgba(42, 42, 42, 0.92);
      color: white; font-size: 22px; line-height: 1; cursor: pointer;
      transition: background 0.15s ease;
    }
    #mapZoomControls button:hover { background: rgba(60, 60, 60, 0.95); }
    #mapZoomControls button:active { background: rgba(80, 80, 80, 0.95); }
    #mapZoomControls button + button { border-top: 1px solid rgba(255, 255, 255, 0.15); }
    #loadingOverlay {
      position: fixed; inset: 0; background: #141414; z-index: 10000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: sans-serif; transition: opacity 0.8s ease, visibility 0.8s;
    }
    .spinner {
      width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%; border-top-color: #ffd700;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    #loadingText { color: #eaeaea; font-size: 16px; font-weight: 300; text-align: center; max-width: 90%; }
    #assetError { color: #ff6b6b; font-size: 13px; margin-top: 12px; max-width: 480px; text-align: center; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Loading Nugi City raster and KML overlay from Cesium Ion...</div>
    <div id="assetError"></div>
  </div>

  <div id="mapZoomControls" aria-label="Map zoom controls">
    <button type="button" id="mapZoomIn" title="Zoom in">+</button>
    <button type="button" id="mapZoomOut" title="Zoom out">−</button>
  </div>

  <div id="cesiumContainer"></div>

  <!-- type="module" enables top-level await (same as Cesium Ion Sandcastle snippet) -->
  <script type="module">
    // Grant CesiumJS access to your ion assets
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5NjNhYjZiZC01YjI1LTQwOTItOGRjNS0zNGM5YmJjN2M5YWYiLCJpZCI6NDQ2Mjc4LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODE3OTc0MTl9.eslbWQ0i9TJnycIrbkiFR-wydnw1O8qgHaxsyn5Xfvw";

    const MY_RASTER_ASSET_ID = 4959394;
    const MY_KML_ASSET_ID = 4971405;

    const viewer = new Cesium.Viewer("cesiumContainer");

    const controller = viewer.scene.screenSpaceCameraController;
    controller.enableZoom = true;
    // Pinch only here; wheel/trackpad is handled below for better laptop support.
    controller.zoomEventTypes = [Cesium.CameraEventType.PINCH];
    controller.inertiaZoom = 0.5;

    function zoomByFactor(factor) {
      const height = viewer.camera.positionCartographic.height;
      if (factor > 1) {
        viewer.camera.zoomOut(height * (factor - 1));
      } else {
        viewer.camera.zoomIn(height * (1 - factor));
      }
    }

    /** Laptop trackpads send small wheel deltas; handle zoom directly. */
    function setupTrackpadZoom() {
      function onWheel(e) {
        e.preventDefault();
        e.stopImmediatePropagation();

        let delta = e.deltaY;
        if (e.deltaMode === WheelEvent.DOM_DELTA_LINE) {
          delta *= 40;
        } else if (e.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
          delta *= 800;
        }
        if (delta === 0) {
          return;
        }

        const height = viewer.camera.positionCartographic.height;
        const sensitivity = 0.004;
        const amount = Math.max(Math.abs(delta) * height * sensitivity, height * 0.02);

        if (delta < 0) {
          viewer.camera.zoomIn(amount);
        } else {
          viewer.camera.zoomOut(amount);
        }
      }

      const mapRoot = viewer.cesiumWidget.container;
      mapRoot.setAttribute("tabindex", "0");
      mapRoot.style.outline = "none";
      mapRoot.addEventListener("wheel", onWheel, { passive: false, capture: true });
      mapRoot.addEventListener("click", () => mapRoot.focus({ preventScroll: true }));
      mapRoot.focus({ preventScroll: true });
    }

    setupTrackpadZoom();

    document.getElementById("mapZoomIn").addEventListener("click", () => zoomByFactor(0.7));
    document.getElementById("mapZoomOut").addEventListener("click", () => zoomByFactor(1.3));

    document.addEventListener("keydown", (e) => {
      if (e.key === "+" || e.key === "=") {
        zoomByFactor(0.7);
      } else if (e.key === "-") {
        zoomByFactor(1.3);
      }
    });

    let userRasterLayer = null;

    function hideLoadingOverlay() {
      document.getElementById("loadingOverlay").classList.add("hidden");
    }

    function showAssetError(msg) {
      const el = document.getElementById("assetError");
      el.style.display = "block";
      el.textContent = msg;
      document.getElementById("loadingText").textContent = "Could not load Ion imagery";
    }

    function drawYellowDottedBoundary(rectangle) {
      if (!rectangle) return;
      const west = Cesium.Math.toDegrees(rectangle.west);
      const south = Cesium.Math.toDegrees(rectangle.south);
      const east = Cesium.Math.toDegrees(rectangle.east);
      const north = Cesium.Math.toDegrees(rectangle.north);
      viewer.entities.add({
        name: "Raster boundary",
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([
            west, north, east, north, east, south, west, south, west, north
          ]),
          width: 4,
          material: new Cesium.PolylineDashMaterialProperty({
            color: Cesium.Color.YELLOW.withAlpha(0.6),
            gapColor: Cesium.Color.TRANSPARENT,
            dashLength: 16
          }),
          clampToGround: true
        }
      });
    }

    function ensureRasterOnTop() {
      if (userRasterLayer) {
        viewer.imageryLayers.raiseToTop(userRasterLayer);
      }
    }

    async function loadIonKmlOverlay(assetId) {
      const resource = await Cesium.IonResource.fromAssetId(assetId);
      const loadOptions = {
        camera: viewer.scene.camera,
        canvas: viewer.scene.canvas,
        clampToGround: true
      };

      try {
        const dataSource = await Cesium.KmlDataSource.load(resource, loadOptions);
        return await viewer.dataSources.add(dataSource);
      } catch (kmlError) {
        console.warn("KmlDataSource failed, trying CzmlDataSource:", kmlError);
        const dataSource = await Cesium.CzmlDataSource.load(resource);
        return await viewer.dataSources.add(dataSource);
      }
    }

    // --- Raster imagery + KML overlay ---
    try {
      userRasterLayer = viewer.imageryLayers.addImageryProvider(
        await Cesium.IonImageryProvider.fromAssetId(MY_RASTER_ASSET_ID),
      );
      ensureRasterOnTop();

      try {
        await loadIonKmlOverlay(MY_KML_ASSET_ID);
      } catch (kmlError) {
        console.error("Error loading Ion KML overlay:", kmlError);
      }

      await viewer.zoomTo(userRasterLayer);
      drawYellowDottedBoundary(userRasterLayer.imageryProvider.rectangle);
      hideLoadingOverlay();
    } catch (error) {
      console.log(error);
      showAssetError(String(error.message || error));
      hideLoadingOverlay();
    }
  </script>
</body>
</html>
